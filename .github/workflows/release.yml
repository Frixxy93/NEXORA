# Publish a downloadable NEXORA installer to the GitHub *Releases* page.
#
# Trigger it either way:
#   • push a tag:        git tag v0.1.0 && git push origin v0.1.0
#   • or the Actions tab → "release" → Run workflow → type a tag (e.g. v0.1.0)
#
# Builds the Windows installer and attaches the .exe + .msi to a GitHub Release,
# so anyone can download it from the Releases page (no login needed).
#
# Updater artifacts are left OFF here — signing them needs your private key and a
# real pubkey in tauri.conf.json. The installer works fully; the installed app
# just won't auto-update until you set up signing (see RELEASING.md). Once you
# do, flip createUpdaterArtifacts back on and add the two signing secrets.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Disable updater artifacts (no signing key in CI yet)
        shell: pwsh
        run: |
          $p = "src-tauri/tauri.conf.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.bundle.createUpdaterArtifacts = $false
          $j | ConvertTo-Json -Depth 100 | Set-Content $p -Encoding utf8

      - name: Build the installer
        run: npm run app:build

      - name: Publish GitHub Release with the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          $files = @()
          $files += (Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue).FullName
          $files += (Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue).FullName
          $files = @($files | Where-Object { $_ })
          Write-Host "Publishing $($files.Count) file(s) to release $env:TAG"
          gh release view "$env:TAG" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $files --repo "${{ github.repository }}" --clobber
          } else {
            gh release create "$env:TAG" $files `
              --repo "${{ github.repository }}" `
              --title "NEXORA $env:TAG" `
              --notes "Windows installer — run the .exe to install NEXORA plus the Maya plug-in (Maya 2026 & 2027)."
          }
