# Publish a SIGNED, self-updating NEXORA release to the GitHub Releases page.
#
# Builds + signs the installer with `tauri build`, assembles latest.json from the
# generated .sig, then publishes with `gh release create --latest` (guaranteed
# NOT a draft, always marked "latest" — so releases/latest/download/latest.json
# resolves). Requires repo secrets TAURI_SIGNING_PRIVATE_KEY + _PASSWORD and the
# matching pubkey in tauri.conf.json (see RELEASING.md).
#
# Trigger: git tag vX.Y.Z && git push origin vX.Y.Z
#     or:  Actions > release > Run workflow > type the tag.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.3"
        required: true
        default: "v0.1.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build + sign the installer
        run: npm run app:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Assemble latest.json and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $bundle = "target/release/bundle"
          $exe = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { throw "installer or signature not found under $bundle/nsis" }
          $sigText = (Get-Content $sig.FullName -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$($exe.Name)"
          $manifest = [ordered]@{
            version   = $ver
            notes     = "NEXORA $env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sigText; url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path "$bundle/latest.json" -Encoding utf8

          $assets = @($exe.FullName, $sig.FullName, "$bundle/latest.json")
          $msi    = Get-ChildItem "$bundle/msi/*.msi"     -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiSig = Get-ChildItem "$bundle/msi/*.msi.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi)    { $assets += $msi.FullName }
          if ($msiSig) { $assets += $msiSig.FullName }

          gh release delete "$env:TAG" --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create "$env:TAG" $assets --repo "${{ github.repository }}" --title "NEXORA $env:TAG" --notes "Windows installer - run the .exe to install NEXORA plus the Maya plug-in (Maya 2026 & 2027). Installed apps auto-update from this release." --latest
