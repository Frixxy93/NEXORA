# Publish a SIGNED, self-updating NEXORA release to the GitHub Releases page.
#
# This is the real auto-update path: it builds the installer, signs the updater
# bundle with your private key, generates `latest.json`, and publishes a Release
# with the installer + signature + latest.json attached. Installed apps read
# `releases/latest/download/latest.json` from this repo and update themselves.
#
# ── ONE-TIME SETUP (required — without it this workflow fails) ──────────────────
#   1. Generate a signing key on your machine:
#        npm run tauri signer generate -- -w "$HOME/.nexora-updater.key"
#      (enter a password when prompted; remember it)
#   2. Put the PUBLIC key (printed, also in ~/.nexora-updater.key.pub) into
#      src-tauri/tauri.conf.json -> plugins.updater.pubkey
#      (replace REPLACE_WITH_TAURI_SIGNER_PUBLIC_KEY), then commit + push.
#   3. Add two repo secrets (Settings > Secrets and variables > Actions):
#        TAURI_SIGNING_PRIVATE_KEY           = full contents of ~/.nexora-updater.key
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = the password from step 1
# ───────────────────────────────────────────────────────────────────────────────
#
# Trigger:  git tag v0.1.1 && git push origin v0.1.1
#      or:  Actions > release > Run workflow > type a tag.
#
# (Quick unsigned installer builds — no setup — still come from build.yml as an
# Actions artifact. This workflow is only for signed, auto-updating releases.)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.1"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          releaseName: "NEXORA ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          releaseBody: "Windows installer — run the .exe to install NEXORA plus the Maya plug-in (Maya 2026 & 2027). Installed apps auto-update from this release."
          releaseDraft: false
          prerelease: false
