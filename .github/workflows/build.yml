# Build the NEXORA Windows installer (.exe / .msi) on every push / on demand.
#
# Produces a downloadable installer in the run's "Artifacts" section — no tags,
# no secrets, no GitHub Release.
#
# Updater artifacts are disabled here: creating them needs your real signing key
# and a valid pubkey in tauri.conf.json (still the placeholder). Real,
# auto-updating releases are cut by release.yml. The installer this produces
# works fully; the installed app just won't self-update until you do a signed
# release.

name: build

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Turn off updater artifacts just for this CI build by editing the config
      # in the disposable checkout (avoids fragile command-line JSON quoting).
      - name: Disable updater artifacts for CI build
        shell: pwsh
        run: |
          $p = "src-tauri/tauri.conf.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.bundle.createUpdaterArtifacts = $false
          $j | ConvertTo-Json -Depth 100 | Set-Content $p -Encoding utf8
          Write-Host "createUpdaterArtifacts -> false for this CI build"

      - name: Build the installer
        run: npm run app:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
