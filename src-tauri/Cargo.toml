[package]
name = "nexora"
description = "NEXORA desktop — material & texture storage for 3D artists."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The library holds the app logic; main.rs is a thin entrypoint. This split is
# what lets Tauri target mobile later and keeps `run()` unit-testable.
[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encode thumbnails as data URLs for the webview (avoids asset-protocol setup).
base64 = "0.22"
nexora-core = { path = "../core" }

# Auto-update via GitHub Releases (spec §60). Desktop-only plugins — the updater
# downloads/verifies signed bundles; the process plugin relaunches after install.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
